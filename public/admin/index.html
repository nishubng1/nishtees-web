<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Support inbox — nishTees</title>
<style>
  /* Deliberately plainer than the storefront. This is a work surface:
     dense, quiet, readable at a glance. The only colour is on things
     that need you to act. */
  :root{
    --paper:#f0efea; --panel:#fbfaf7; --ink:#0b0b0c; --muted:#6b6a66;
    --rule:#d6d4cb; --accent:#ff5a1f; --pine:#25503f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:400 15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{background:var(--ink);color:var(--paper);padding:.9rem 1.25rem;
         display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  header h1{font-size:1rem;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sub{color:#ffffff8c;font-size:.82rem;margin-right:auto}

  nav{display:flex;gap:1.4rem;padding:0 1.25rem;background:var(--panel);
      border-bottom:1px solid var(--rule);overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;
             padding:.75rem 0;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  nav .badge{display:inline-block;margin-left:.35rem;background:var(--accent);color:#fff;
             font-size:.7rem;padding:0 .35rem;border-radius:2px;font-variant-numeric:tabular-nums}

  main{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--rule)}
  @media(min-width:900px){ main{grid-template-columns:minmax(0,380px) minmax(0,1fr)} }

  .list,.detail{background:var(--panel);min-height:60vh}
  .thread{padding:.85rem 1.25rem;border-bottom:1px solid #e8e6df;cursor:pointer;
          display:block;width:100%;text-align:left;background:none;border-left:3px solid transparent;
          font:inherit;color:inherit}
  .thread:hover{background:#f4f2ec}
  .thread[aria-current="true"]{background:#f4f2ec;border-left-color:var(--accent)}
  .thread .who{font-weight:500;font-size:.9rem}
  .thread .who.anon{color:var(--muted);font-weight:400;font-style:italic}
  .thread .q{color:var(--muted);font-size:.85rem;margin-top:.15rem;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .thread .meta{margin-top:.35rem;font-size:.72rem;color:var(--muted);
                display:flex;gap:.6rem;align-items:center}

  .tag{font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;
       padding:.1rem .35rem;border:1px solid currentColor}
  .t-wait{color:var(--accent)} .t-ans{color:var(--pine)} .t-mute{color:var(--muted)}

  .detail{padding:1.25rem}
  .detail h2{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
             color:var(--muted);margin:0 0 .8rem;font-weight:600}
  .msg{margin-bottom:.9rem;max-width:46rem}
  .msg .role{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .msg .body{white-space:pre-line;margin-top:.2rem;padding:.55rem .75rem;font-size:.92rem}
  .msg.customer .body{background:var(--ink);color:var(--paper);display:inline-block}
  .msg.bot .body{background:#00000008;border-left:2px solid var(--rule)}
  .msg.bot.gave-up .body{border-left-color:var(--accent)}
  .msg .src{font-size:.68rem;color:var(--muted);margin-top:.15rem}

  .actions{border-top:1px solid var(--rule);margin-top:1.25rem;padding-top:1rem;
           display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  button.act{font:inherit;font-size:.88rem;padding:.5rem .9rem;cursor:pointer;
             background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
  button.act.ghost{background:none;color:var(--ink)}
  button.act:hover{opacity:.85}
  a.act{text-decoration:none;display:inline-block}

  .empty{padding:3rem 1.25rem;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:.3rem}
  .err{margin:1rem 1.25rem;padding:.7rem 1rem;border-left:3px solid var(--accent);background:#ff5a1f10}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <h1>Support inbox</h1>
  <span class="sub" id="summary"></span>
  <button class="act ghost" id="refresh" style="background:#ffffff1a;color:#fff;border-color:#ffffff33">Refresh</button>
</header>

<nav id="tabs">
  <button data-status="waiting" aria-selected="true">Waiting <span class="badge" id="b-waiting">0</span></button>
  <button data-status="open" aria-selected="false">Handled</button>
  <button data-status="answered" aria-selected="false">Answered</button>
  <button data-status="all" aria-selected="false">All</button>
</nav>

<div id="error" class="err hide"></div>

<main>
  <div class="list" id="list"></div>
  <div class="detail" id="detail">
    <div class="empty">Pick a conversation to read it.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let status = 'waiting';
let currentId = null;

// sessionStorage, not localStorage — the key shouldn't outlive the tab.
function adminKey(){
  let k = sessionStorage.getItem('nt_admin_key');
  if(!k){ k = prompt('Admin key'); if(k) sessionStorage.setItem('nt_admin_key', k); }
  return k;
}

async function api(path, opts = {}){
  const res = await fetch('/api/admin/support' + path, {
    ...opts,
    headers: {'x-admin-key': adminKey(), 'content-type':'application/json', ...(opts.headers||{})},
  });
  if(res.status === 401){
    sessionStorage.removeItem('nt_admin_key');
    throw new Error('Admin key rejected. Reload and try again.');
  }
  if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error || 'Request failed');
  return res.json();
}

function showError(msg){
  const box = $('error');
  if(!msg){ box.classList.add('hide'); return; }
  box.textContent = msg; box.classList.remove('hide');
}

function when(iso){
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  if(mins < 1440) return Math.round(mins/60) + 'h ago';
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadList(){
  const d = await api('?status=' + status);

  $('b-waiting').textContent = d.counts.waiting ?? 0;
  $('b-waiting').style.display = d.counts.waiting ? '' : 'none';
  $('summary').textContent =
    `${d.counts.escalated ?? 0} conversations the bot couldn't answer`;

  if(!d.threads.length){
    $('list').innerHTML = `<div class="empty"><b>Nothing here.</b>${
      status === 'waiting' ? 'Nobody is waiting on a reply.' : 'No conversations yet.'}</div>`;
    return;
  }

  $('list').innerHTML = d.threads.map(t => {
    const who = t.contact_email || t.contact_phone;
    return `<button class="thread" data-id="${t.id}" ${t.id===currentId?'aria-current="true"':''}>
      <div class="who ${who?'':'anon'}">${who ? esc(who) : 'No contact left'}</div>
      <div class="q">${esc(t.first_message) || '(no message)'}</div>
      <div class="meta">
        <span class="tag ${t.status==='waiting'?'t-wait':t.status==='answered'?'t-ans':'t-mute'}">${t.status}</span>
        <span>${t.message_count} msg</span>
        <span>${when(t.last_message_at)}</span>
      </div>
    </button>`;
  }).join('');

  $('list').querySelectorAll('.thread').forEach(b =>
    b.onclick = () => openThread(b.dataset.id));
}

async function openThread(id){
  currentId = id;
  $('list').querySelectorAll('.thread').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.id === id)));

  const d = await api('?id=' + id);
  const t = d.thread;
  const who = t.contact_email || t.contact_phone;

  const transcript = d.messages.map(m => {
    const gaveUp = m.role === 'bot' && ['escalation','known-gap'].includes(m.source);
    return `<div class="msg ${m.role} ${gaveUp?'gave-up':''}">
      <div class="role">${m.role === 'customer' ? 'Customer' : m.role === 'human' ? 'You' : 'Bot'}</div>
      <div class="body">${esc(m.body)}</div>
      ${m.source ? `<div class="src">${esc(m.source)}${gaveUp ? " — couldn't answer" : ''}</div>` : ''}
    </div>`;
  }).join('');

  const mailto = t.contact_email
    ? `mailto:${encodeURIComponent(t.contact_email)}?subject=${
        encodeURIComponent('Re: your question — nishTees')}&body=${
        encodeURIComponent('Hi,\n\nThanks for getting in touch.\n\n')}`
    : null;
  const wa = t.contact_phone ? `https://wa.me/91${t.contact_phone}` : null;

  $('detail').innerHTML = `
    <h2>${who ? esc(who) : 'Anonymous visitor'} · started ${when(t.created_at)}</h2>
    ${transcript || '<div class="empty">No messages.</div>'}
    <div class="actions">
      ${mailto ? `<a class="act" href="${mailto}">Reply by email</a>` : ''}
      ${wa ? `<a class="act ghost" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
      ${t.status !== 'answered' ? `<button class="act ghost" data-set="answered">Mark answered</button>` : ''}
      ${t.status !== 'closed' ? `<button class="act ghost" data-set="closed">Close</button>` : ''}
    </div>
    ${!who ? `<p style="color:var(--muted);font-size:.85rem;margin-top:1rem">
        They left without giving contact details, so there's no way to reply.
        Worth reading anyway — it tells you what your site doesn't answer.</p>` : ''}`;

  $('detail').querySelectorAll('[data-set]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true;
      try{
        await api('', {method:'POST', body: JSON.stringify({id, status: b.dataset.set})});
        await loadList(); await openThread(id);
      }catch(e){ showError(e.message); b.disabled = false; }
    });
}

$('tabs').querySelectorAll('button').forEach(b =>
  b.onclick = () => {
    status = b.dataset.status;
    $('tabs').querySelectorAll('button').forEach(x =>
      x.setAttribute('aria-selected', String(x === b)));
    refresh();
  });

async function refresh(){
  showError('');
  try{ await loadList(); }
  catch(e){ showError(e.message); }
}

$('refresh').onclick = refresh;
refresh();
setInterval(refresh, 60000); // quiet poll; this is not a live chat queue
</script>
</body>
</html>
